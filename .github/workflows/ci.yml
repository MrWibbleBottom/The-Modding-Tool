name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          if (Test-Path bridges/bepinex-mcp/mcp/requirements.txt) {
            python -m pip install -r bridges/bepinex-mcp/mcp/requirements.txt
          }

      # backups/ is git-ignored, so seed a baseline for test_backup_restore_integrity.
      - name: Create baseline backup
        shell: pwsh
        run: python backup_manager.py --baseline --reason "CI baseline"

      - name: Run test suite
        shell: pwsh
        run: python -m pytest tests/ -v
